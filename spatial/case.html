<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case study — Triumph Ohwojeheri</title>
<link rel="icon" href="../Favicon.avif">
<script>try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="case.css">
<script src="cases.js"></script>
</head>
<body class="case">
<header class="topbar">
  <a class="home" href="index.html#work"><span class="mono">t.</span>Triumph Ohwojeheri</a>
  <div class="tb-right">
    <a class="tb-next" id="tbNext"></a>
    <button class="theme" id="theme" aria-label="Switch light or dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<main id="main"></main>
<nav class="orn" id="orn" aria-label="Sections"></nav>
<div class="lightbox" id="lb"><img id="lbImg" alt=""><p id="lbCap"></p></div>

<script>
(function(){
"use strict";
function src(f){ return '../' + encodeURI(f); }
function web(f){ return 'img/' + encodeURI(f); }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
var q = new URLSearchParams(location.search).get('p');
var idx = Math.max(0, CASES.findIndex(function(c){ return c.slug === q; }));
var c = CASES[idx], next = CASES[(idx + 1) % CASES.length];
document.title = c.name + ' — Triumph Ohwojeheri';
var tbNext = document.getElementById('tbNext'); tbNext.href = 'case.html?p=' + next.slug; tbNext.textContent = 'Next: ' + next.name;

function fig(img, cap, cls){
  return '<figure class="fig rv ' + (cls || '') + '"><div class="fwin"><img src="' + web(img) + '" data-full="' + src(img) + '" alt="' + esc(cap || c.name) + '" loading="lazy"></div>' +
    (cap ? '<figcaption>' + cap + '</figcaption>' : '') + '</figure>';
}
function paras(list, cls){ return list.map(function(p){ return '<p class="' + (cls || 'body') + ' rv">' + p + '</p>'; }).join(''); }
var n = 0;
function sec(id, name, body){ n++; return '<section class="sec" id="' + id + '"><h2 class="sname rv"><span>' + String(n).padStart(2, '0') + '</span>' + name + '</h2><div class="sbody">' + body + '</div></section>'; }

/* images used in the hero or decisions aren't repeated in the gallery */
var used = [c.hero].concat(c.decisions.map(function(d){ return d.img; }));
var rest = c.screens.filter(function(s){ return used.indexOf(s.img) < 0; });

var H = '<header class="head">' +
  '<p class="eyebrow rv">Case study · ' + c.category + ' · ' + c.year + '</p>' +
  '<h1 class="rv">' + c.name + '</h1>' +
  '<div class="head-grid"><p class="summary rv">' + c.summary + '</p>' +
  '<dl class="facts rv">' + c.meta.map(function(m){ return '<div><dt>' + m[0] + '</dt><dd>' + m[1] + '</dd></div>'; }).join('') + '</dl></div></header>' +
  '<div class="hero-wrap"><div class="hero' + (c.heroContain ? ' contain' : '') + '" id="hero">' + fig(c.hero, '') + '</div></div>';

H += '<article class="article">';
H += sec('context', 'Context', paras(c.context));
H += sec('problem', 'The problem', paras(c.problem) +
  '<div class="before rv"><p class="mini">How it worked before</p><ol>' + c.before.map(function(b){ return '<li>' + b + '</li>'; }).join('') + '</ol></div>');
H += sec('role', 'My role', paras(c.role));
H += sec('findings', 'What I found', '<ul class="points">' + c.findings.map(function(f){ return '<li class="rv"><strong>' + f[0] + '</strong> ' + f[1] + '</li>'; }).join('') + '</ul>');
H += sec('process', 'Process', '<ol class="steps">' + c.process.map(function(s, i){ return '<li class="rv"><span>' + String(i + 1).padStart(2, '0') + '</span><b>' + s[0] + '</b><p>' + s[1] + '</p></li>'; }).join('') + '</ol>');
H += sec('decisions', 'Decisions', c.decisions.map(function(d){
  return '<div class="decision"><h3 class="rv">' + d.t + '</h3><p class="body rv">' + d.d + '</p><p class="trade rv"><span>Trade-off.</span> ' + d.tradeoff + '</p>' +
    (d.img ? fig(d.img, d.cap, 'wide') : '') + '</div>'; }).join(''));
if (rest.length || c.confidential) H += sec('screens', 'More screens', (c.confidential ? '<p class="body rv">' + c.confidential + '</p>' : '') +
  '<div class="gallery' + (rest.length === 1 ? ' one' : '') + '">' + rest.map(function(s){ return fig(s.img, '<b>' + s.t + '.</b> ' + s.d); }).join('') + '</div>');
H += sec('outcome', 'Outcome', '<ul class="points">' + c.outcome.map(function(o){ return '<li class="rv"><strong>' + o[0] + '</strong> ' + o[1] + '</li>'; }).join('') + '</ul>');
H += sec('reflection', 'Looking back', paras(c.reflection));
H += '</article>';

H += '<a class="next rv" href="case.html?p=' + next.slug + '"><div class="next-text"><p class="eyebrow">Next project</p><h2>' + next.name + '</h2><p>' + next.tagline + '</p></div>' +
  '<div class="next-img"><img src="thumbs/' + encodeURI(next.thumb) + '" alt="' + esc(next.name) + '" loading="lazy"></div></a>' +
  '<footer class="cfoot"><span>© 2026 Triumph Ohwojeheri</span><a href="mailto:triumphohwojeheri@gmail.com">triumphohwojeheri@gmail.com</a><a href="index.html#work">Back to the room</a></footer>';
document.getElementById('main').innerHTML = H;

/* ---------- theme ---------- */
document.getElementById('theme').addEventListener('click', function(){
  var t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (er) {}
});

/* ---------- section menu with scroll-spy ---------- */
var NAV = [['context', 'Context'], ['problem', 'Problem'], ['findings', 'Findings'], ['process', 'Process'], ['decisions', 'Decisions'], ['outcome', 'Outcome']];
var orn = document.getElementById('orn');
orn.innerHTML = '<a href="index.html#work" class="back">Room</a>' + NAV.map(function(x){ return '<a href="#' + x[0] + '">' + x[1] + '</a>'; }).join('');
var links = [].slice.call(orn.querySelectorAll('a[href^="#"]'));

/* ---------- the hero screen settles in front of you as you scroll ---------- */
var hero = document.getElementById('hero');
function onScroll(){
  var y = innerHeight * .35, on = null;
  NAV.forEach(function(x, i){ var s = document.getElementById(x[0]); if (s && s.getBoundingClientRect().top < y) on = i; });
  links.forEach(function(l, i){ l.classList.toggle('on', i === on); });
  orn.classList.toggle('show', scrollY > innerHeight * .6);
  var r = hero.getBoundingClientRect(), k = Math.max(0, Math.min(1, (innerHeight - r.top) / (innerHeight * .9)));
  hero.style.transform = 'rotateX(' + ((1 - k) * 16).toFixed(2) + 'deg) scale(' + (.92 + k * .08).toFixed(3) + ')';
}
addEventListener('scroll', onScroll, { passive: true }); onScroll();

/* ---------- things fade up as you reach them ---------- */
var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -6% 0px' });
[].forEach.call(document.querySelectorAll('.rv'), function(el){ io.observe(el); });

/* ---------- screens tilt slightly toward the cursor, and open full size ---------- */
var FINE = matchMedia('(pointer:fine)').matches;
[].forEach.call(document.querySelectorAll('.article .fig, .hero .fig'), function(f){
  var w = f.querySelector('.fwin');
  if (FINE && !f.closest('.hero')) {
    f.addEventListener('pointermove', function(e){
      var r = w.getBoundingClientRect(), u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5;
      w.style.transform = 'rotateX(' + (-v * 3).toFixed(2) + 'deg) rotateY(' + (u * 4).toFixed(2) + 'deg)';
    });
    f.addEventListener('pointerleave', function(){ w.style.transform = ''; });
  }
  w.addEventListener('click', function(){ zoom(f); });
});
var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap'), from = null;
function zoom(f){
  var im = f.querySelector('img'); from = im;
  lbImg.src = im.src; var full = im.getAttribute('data-full');
  if (full) { var hi = new Image(); hi.onload = function(){ if (from === im) lbImg.src = full; }; hi.src = full; }
  lbCap.innerHTML = f.querySelector('figcaption') ? f.querySelector('figcaption').innerHTML : '';
  lb.classList.add('open'); document.body.classList.add('lb-open');
  var go = function(){
    var a = im.getBoundingClientRect(), b = lbImg.getBoundingClientRect();
    lbImg.animate([{ transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')' }, { transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.2,.9,.1,1)' });
  };
  lbImg.complete ? go() : lbImg.onload = go;
}
function unzoom(){
  if (!lb.classList.contains('open')) return;
  var a = from.getBoundingClientRect(), b = lbImg.getBoundingClientRect();
  lbImg.animate([{ transform: 'none' }, { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')' }], { duration: 240, easing: 'cubic-bezier(.4,0,.2,1)' })
    .onfinish = function(){ lb.classList.remove('open'); };
  document.body.classList.remove('lb-open');
}
lb.addEventListener('click', unzoom);
addEventListener('keydown', function(e){ if (e.key === 'Escape') unzoom(); });
})();
</script>
</body>
</html>
