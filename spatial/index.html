<script>
(function(){

/* ---------- the room's dimensions (px, the viewer's eye is at 0,0,0) ---------- */
var R = 1000, FLOOR = 520, CEIL = -760, RW = 2100, RP = 1420;

/* ---------- what hangs where. ang: degrees around you (negative = left); y: height; z: nearer (+) or further (-) ---------- */

});
PANELS.push({ ang: WORK, y: 330, z: 200, w: 300, h: 60, d: .3, kind: 'ctrl',
  html: '<div class="ctrl"><button data-step="-1" aria-label="Previous project">←</button><span class="dots" id="dots">' +
        CASES.map(function(c, i){ return '<i data-pick="' + i + '"></i>'; }).join('') + '</span><button data-step="1" aria-label="Next project">→</button></div>' });
/* the playground: four pieces at a time, two by two (see "the playground pages" below) */
var PLAY = 152, NPAGE = Math.ceil(PLAYGROUND.length / 4), PW = 440, PH = 362, PGAP = 26;
PLAYGROUND.forEach(function(g, i){
  var media = g.loop
    ? '<video muted loop playsinline preload="none" poster="loops/' + g.loop + '.jpg" src="loops/' + g.loop + '.mp4"></video>'

    html: '<figure class="tile"><div class="tm-media' + (g.loop ? ' is-loop' : '') + '" style="background:' + (g.bg || 'var(--panel)') + '">' + media + '</div>' +
          '<figcaption><b>' + esc(g.t) + '</b><span>' + esc(g.by) + '</span></figcaption></figure>' });
});
PANELS.push({ ang: PLAY, y: 430, z: 60, w: 220, h: 56, d: .6, kind: 'ctrl',
  html: '<div class="ctrl"><button data-pstep="-1" aria-label="Previous page">←</button><span class="dots" id="pdots">' +
        Array.apply(null, Array(NPAGE)).map(function(_, i){ return '<i data-ppick="' + i + '"></i>'; }).join('') + '</span><button data-pstep="1" aria-label="Next page">→</button></div>' });
PANELS.push(
  /* the about wall: one card, a summary beside a small arrangement of photos that fans out when you face it */
  { ang: -58, y: -10, w: 900, h: 470, d: .3, kind: 'about', stack: true,
    html: '<div class="about-sum"><div class="fan" id="fan">' +
            '<figure class="fp fp-l"><img src="' + th('photo-3.jpg') + '" alt="" draggable="false"></figure>' +
            '<figure class="fp fp-r"><img src="' + th('photo-8.jpg') + '" alt="" draggable="false"></figure>' +
            '<figure class="fp fp-c"><img src="' + th('photo-4.jpg') + '" alt="Triumph Ohwojeheri" draggable="false"></figure></div>' +
          '<div class="sum"><span class="eyebrow">About</span>' +
            '<div class="h2">Curious by nature.<br>Intentional by design.</div>' +
            '<div class="p">I’m Triumph, a product designer in Lagos with 4+ years across fintech, Web3, AI and SaaS. I work end to end, from research and flows to high-fidelity UI and design systems, and I’ve led zero-to-one design for trading, payments and decentralised apps.</div>' +
            '<p class="sum-k">8 teams · 20+ projects · lately Glitch Markets, Human Tech, Space and Time</p>' +
            '<div class="row"><a class="btn pri" href="about.html">My story and experience</a><a class="btn" href="resume.pdf" target="_blank" rel="noopener">Resume</a></div></div></div>' },
  { ang: -114, y: -10, w: 480, h: 380, d: .45, kind: 'contact',
    html: '<div class="in"><span class="small">Have something in mind?</span><div class="h1 md">Let’s make it<br>something good.</div>' +
          '<a class="mail" href="mailto:triumphohwojeheri@gmail.com">triumphohwojeheri@gmail.com</a>' +
          '<div class="row"><a class="btn pri" href="mailto:triumphohwojeheri@gmail.com">Email me</a><a class="btn" href="https://calendly.com/triumphohwojeheri/30min" target="_blank" rel="noopener">Book a call</a></div>' +
          '<div class="socials"><a href="https://twitter.com/amazinglanky" target="_blank" rel="noopener">X</a><a href="https://instagram.com/amazinglanky" target="_blank" rel="noopener">Instagram</a><a href="https://dribbble.com/amazinglanky" target="_blank" rel="noopener">Dribbble</a><a href="https://linkedin.com/in/triumph-ohwojeheri" target="_blank" rel="noopener">LinkedIn</a><span class="clock" id="clock"></span></div></div>' }
);
var LABELS = [{ t: 'Selected work', ang: 62, y: -500 }, { t: 'Playground', ang: 152, y: -500 }, { t: 'About', ang: -58, y: -320 }, { t: 'Contact', ang: -114, y: -250 }];

/* ---------- build ---------- */
var stage = document.getElementById('stage'), world = document.getElementById('world');
function put(cls, w, h, transform, html){
  var e = document.createElement('div'); e.className = cls;
  e.style.width = w + 'px'; e.style.height = h + 'px'; e.style.left = -w / 2 + 'px'; e.style.top = -h / 2 + 'px';
  e.style.transform = transform; if (html) e.innerHTML = html;
  world.appendChild(e); return e;
}
/* the room's structure (floor, walls, ceiling light, pillars, pools, shadows) is drawn on a canvas: see "the room, drawn flat" */
var PILLARS = [-88, -27, 113, -155], POOLS = [[0, 1500, 900], [62, 2000, 1000], [152, 1500, 800], [-58, 1400, 800], [-114, 1100, 700]], SHADOWS = [];

var els = PANELS.map(function(p, i){
  var e = put('panel k-' + p.kind, p.w, p.h, 'rotateY(' + (-p.ang) + 'deg) translate3d(0,' + p.y + 'px,' + (-(R - (p.z || 0))) + 'px)',
    '<div class="lift" style="--d:' + p.d.toFixed(2) + 's"><div class="back"></div><div class="face">' + p.html + '</div></div><div class="grab"></div>');
  e._i = i;
  if (p.stack) return e;
  /* each window casts a soft shadow on the floor below it */
  SHADOWS.push({ ang: p.ang, r: R - (p.z || 0) - 40, w: p.w * 1.05, d: 160, a: Math.max(.25, 1 - (FLOOR - (p.y + p.h / 2)) / 900) });
  return e;
});
LABELS.forEach(function(l){
  var e = document.createElement('div'); e.className = 'label'; e.textContent = l.t;
  e.style.transform = 'rotateY(' + (-l.ang) + 'deg) translate3d(-50%,' + l.y + 'px,' + (-R) + 'px)';
  world.appendChild(e);
});

/* ---------- the room, drawn flat ----------
   The floor, walls, ceiling light, pillars, light pools and shadows used to be huge 3D layers (the ceiling alone was 5600px
   square). Chromium keeps every 3D layer in GPU memory and drops pieces when it runs short, which made the windows blink.
   Now they are projected onto one canvas with exactly the camera the windows use, so only the windows are real 3D. */
var rcv = document.getElementById('roomCv'), rcx = rcv.getContext('2d'), RCW = 0, RCH = 0, RDPR = Math.min(2, devicePixelRatio || 1);
var CAM = { yr: 0, xr: 0, cx: 0, cy: 0, tz: 900 }, ceilA = 1, NEAR = 30;
var CSSV = getComputedStyle(document.documentElement);
function cv(n){ return CSSV.getPropertyValue(n).trim(); }
var COL = { skyTop: cv('--sky-top'), skyHz: cv('--sky-hz'), wallTop: cv('--wall-top'), wallMid: cv('--wall-mid'), wallLow: cv('--wall-low'),
  floor: cv('--floor'), ceil: cv('--ceil'), pillarA: cv('--pillar-a'), pillarB: cv('--pillar-b') };
function sizeRoom(){ RCW = innerWidth; RCH = innerHeight; rcv.width = Math.round(RCW * RDPR); rcv.height = Math.round(RCH * RDPR); rcx.setTransform(RDPR, 0, 0, RDPR, 0, 0); }
function polar(ang, r, y){ var a = ang * Math.PI / 180; return [r * Math.sin(a), y, -r * Math.cos(a)]; }
/* world point -> camera space [x, y, depth in front of the eye], the same order CSS applies the world's transform */
function toCam(p){
  var ay = CAM.yr * Math.PI / 180, ax = CAM.xr * Math.PI / 180, cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  var x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
  var y2 = p[1] * cx - z1 * sx, z2 = p[1] * sx + z1 * cx;
  return [x1 - CAM.cx, y2 - CAM.cy, P - (z2 + CAM.tz)];
}
function scr(c){ return [RCW / 2 + c[0] * P / c[2], RCH / 2 + c[1] * P / c[2]]; }
/* keep only the part of a polygon in front of the eye */
function clip(poly){
  var out = [];
  for (var i = 0; i < poly.length; i++) {
    var a = poly[i], b = poly[(i + 1) % poly.length], ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) { var t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]); }
  }
  return out;
}
function path(world){ var c = clip(world.map(toCam)); if (c.length < 3) return false; rcx.beginPath(); c.forEach(function(q, i){ var s = scr(q); i ? rcx.lineTo(s[0], s[1]) : rcx.moveTo(s[0], s[1]); }); rcx.closePath(); return true; }
function line(a, b){
  var p = toCam(a), q = toCam(b);
  if (p[2] < NEAR && q[2] < NEAR) return;
  if (p[2] < NEAR) { var t = (NEAR - p[2]) / (q[2] - p[2]); p = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, NEAR]; }
  if (q[2] < NEAR) { var u = (NEAR - q[2]) / (p[2] - q[2]); q = [q[0] + (p[0] - q[0]) * u, q[1] + (p[1] - q[1]) * u, NEAR]; }
  var s1 = scr(p), s2 = scr(q); rcx.moveTo(s1[0], s1[1]); rcx.lineTo(s2[0], s2[1]);
}
function circle(r, y, n){ var pts = []; for (var i = 0; i < n; i++) pts.push(polar(i * 360 / n, r, y)); return pts; }
/* an ellipse lying on the floor, centred in front of a wall, its long side along the wall */
function floorEllipse(ang, r, w, d, scale){
  var a = ang * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), c = polar(ang, r, FLOOR), pts = [];
  for (var i = 0; i < 28; i++) { var t = i / 28 * Math.PI * 2, u = Math.cos(t) * w / 2 * scale, v = Math.sin(t) * d / 2 * scale; pts.push([c[0] + u * ca - v * sa, FLOOR, c[2] + u * sa + v * ca]); }
  return pts;
}
function drawRoom(){
  var g = rcx.createLinearGradient(0, 0, 0, RCH);
  g.addColorStop(0, COL.skyTop); g.addColorStop(.6, COL.skyHz); g.addColorStop(1, COL.floor);
  rcx.fillStyle = g; rcx.fillRect(0, 0, RCW, RCH);
  /* ceiling and its ring light (hidden while you look down from above) */
  if (ceilA > .01) {
    rcx.globalAlpha = ceilA;
    if (path(circle(RW, CEIL, 72))) { rcx.fillStyle = COL.ceil; rcx.fill(); }
    var ring = circle(1500, CEIL, 96);
    rcx.beginPath(); for (var i = 0; i < ring.length; i++) line(ring[i], ring[(i + 1) % ring.length]);
    rcx.strokeStyle = 'rgba(255,255,255,.35)'; rcx.lineWidth = 16; rcx.stroke();
    rcx.strokeStyle = 'rgba(255,255,255,.95)'; rcx.lineWidth = 2.5; rcx.stroke();
    rcx.globalAlpha = 1;
  }
  /* floor, its grid, the light pools, the ring where the windows stand, the shadows */
  if (path(circle(RW, FLOOR, 96))) { rcx.fillStyle = COL.floor; rcx.fill(); }
  POOLS.forEach(function(q){ for (var s = 1; s > .2; s -= .2) if (path(floorEllipse(q[0], R, q[1], q[2], s))) { rcx.fillStyle = 'rgba(255,255,255,.14)'; rcx.fill(); } });
  rcx.beginPath();
  for (var gx = -RW + 100; gx < RW; gx += 160) { var hz = Math.sqrt(RW * RW - gx * gx); line([gx, FLOOR, -hz], [gx, FLOOR, hz]); line([-hz, FLOOR, gx], [hz, FLOOR, gx]); }
  rcx.strokeStyle = 'rgba(24,24,27,.045)'; rcx.lineWidth = 1; rcx.stroke();
  var fr = circle(R + 60, FLOOR, 96);
  rcx.beginPath(); for (var j = 0; j < fr.length; j++) line(fr[j], fr[(j + 1) % fr.length]);
  rcx.strokeStyle = 'rgba(24,24,27,.10)'; rcx.lineWidth = 2; rcx.stroke();
  SHADOWS.forEach(function(sh){ for (var s = 1; s > .3; s -= .23) if (path(floorEllipse(sh.ang, sh.r, sh.w, sh.d, s))) { rcx.fillStyle = 'rgba(50,40,70,' + (.07 * sh.a).toFixed(3) + ')'; rcx.fill(); } });
  /* the curved wall, far segments first */
  var N = 48, half = 180 / N + .4, quads = [];
  for (var k = 0; k < N; k++) {
    var a0 = k * 360 / N - half, a1 = k * 360 / N + half, q = [polar(a0, RW, CEIL), polar(a1, RW, CEIL), polar(a1, RW, FLOOR), polar(a0, RW, FLOOR)];
    var m = toCam(polar(k * 360 / N, RW, (CEIL + FLOOR) / 2));
    quads.push({ q: q, d: m[2], top: polar(k * 360 / N, RW, CEIL), bot: polar(k * 360 / N, RW, FLOOR) });
  }
  quads.sort(function(a, b){ return b.d - a.d; });
  quads.forEach(function(w){
    if (!path(w.q)) return;
    var t = toCam(w.top), b = toCam(w.bot);
    if (t[2] < NEAR || b[2] < NEAR) { rcx.fillStyle = COL.wallMid; rcx.fill(); return; }
    var st = scr(t), sb = scr(b), wg = rcx.createLinearGradient(st[0], st[1], sb[0], sb[1]);
    wg.addColorStop(0, COL.wallTop); wg.addColorStop(.55, COL.wallMid); wg.addColorStop(.92, COL.wallLow); wg.addColorStop(1, COL.floor);
    rcx.fillStyle = wg; rcx.fill();
  });
  /* pillars between the rooms */
  PILLARS.forEach(function(a){
    var w = 90 / RP * 180 / Math.PI / 2, q = [polar(a - w, RP, CEIL), polar(a + w, RP, CEIL), polar(a + w, RP, FLOOR), polar(a - w, RP, FLOOR)];
    if (!path(q)) return;
    var l = toCam(polar(a - w, RP, 0)), r = toCam(polar(a + w, RP, 0));
    if (l[2] < NEAR || r[2] < NEAR) { rcx.fillStyle = COL.pillarA; rcx.fill(); return; }
    var sl = scr(l), sr = scr(r), pg = rcx.createLinearGradient(sl[0], sl[1], sr[0], sr[1]);
    pg.addColorStop(0, COL.pillarB); pg.addColorStop(.45, COL.pillarA); pg.addColorStop(1, COL.pillarB);
    rcx.fillStyle = pg; rcx.fill();
  });
}
sizeRoom();
addEventListener('resize', function(){ sizeRoom(); lastWT = ''; });

/* ---------- the work slider: the current project stands in front of you; the ones either side wait further back ----------
   Every card stays parallel to the wall (nothing rotates), and each one only ever gets a new slot, which the browser
   animates by itself. Parallel planes sliding are the steadiest thing 3D CSS can do, so nothing flickers. */
var current = 0, slideEls = els.filter(function(e){ return PANELS[e._i].kind === 'case'; }), dots = document.getElementById('dots');
var FRONT = 220, SIDE_X = 860, SIDE_Z = 760, FAR_X = 1500;   /* front card nearer than the wall; side cards out and back */
SHADOWS.push({ ang: WORK, r: R - FRONT - 30, w: 1100, d: 260, a: 1 });
function adiff(a, b){ return ((a - b) % 360 + 540) % 360 - 180; }   /* shortest signed angle from b to a */
function placeSlides(){
  slideEls.forEach(function(e){
    var o = ((PANELS[e._i].ci - current) % NCASE + NCASE * 1.5) % NCASE - NCASE / 2;   /* -3 … 2: where this card sits relative to the current one */
    var a = Math.abs(o), sx = o < 0 ? -1 : 1;
    var x = a === 0 ? 0 : a === 1 ? sx * SIDE_X : sx * FAR_X, z = R - FRONT + Math.min(a, 2) * SIDE_Z;
    if (!e._veil) { e._veil = document.createElement('i'); e._veil.className = 'veil'; e.querySelector('.face').appendChild(e._veil); }
    e.dataset.slot = a === 0 ? 'front' : a === 1 ? 'side' : 'away';
    e.style.transform = 'rotateY(' + (-WORK) + 'deg) translate3d(' + x + 'px,-10px,' + (-z) + 'px)';
  });
  [].forEach.call(dots.children, function(d, i){ d.classList.toggle('on', i === current); });
}
function setCurrent(i){ current = ((i % NCASE) + NCASE) % NCASE; placeSlides(); }
var stepLock = 0, wheelAcc = 0, wheelIdle;
function step(d){ var now = performance.now(); if (now - stepLock < 420) return; stepLock = now; setCurrent(current + d); }
function nearWork(){ return Math.abs(adiff(yaw, WORK)) < 24; }
placeSlides();

/* ---------- the playground pages ----------
   One page of four stands in front of you; the others wait out of sight to either side and slide in, a tile at a time.
   Like the work slider, nothing rotates: tiles only change slot. Loops play only on the page in front of you. */
var page = 0, playEls = els.filter(function(e){ return PANELS[e._i].kind === 'play'; }), pdots = document.getElementById('pdots');
var PLAY_Z = 40, AWAY_X = 1500, AWAY_Z = 600;
function placePage(){
  playEls.forEach(function(e){
    var p = PANELS[e._i], o = ((p.page - page) % NPAGE + NPAGE * 1.5) % NPAGE - NPAGE / 2;
    o = o === 0 ? 0 : o < 0 ? -1 : 1;
    var col = p.slot % 2, row = p.slot >> 1;
    var x = (col ? 1 : -1) * (PW + PGAP) / 2 + o * AWAY_X, y = (row ? 1 : -1) * (PH + PGAP) / 2 - 20, z = R - PLAY_Z + Math.abs(o) * AWAY_Z;
    e.dataset.slot = o === 0 ? 'front' : 'away';
    e.style.transitionDelay = o === 0 ? p.slot * 45 + 'ms, 0s' : '';   /* tiles arrive one after another; leaving keeps the stylesheet's delay for visibility */
    e.style.transform = 'rotateY(' + (-PLAY) + 'deg) translate3d(' + x + 'px,' + y + 'px,' + (-z) + 'px)';
  });
  [].forEach.call(pdots.children, function(d, i){ d.classList.toggle('on', i === page); });
  syncLoops(true);
}
function setPage(i){ page = ((i % NPAGE) + NPAGE) % NPAGE; placePage(); }
var pageLock = 0;
function stepPage(d){ var now = performance.now(); if (now - pageLock < 420) return; pageLock = now; setPage(page + d); }
function nearPlay(){ return Math.abs(adiff(yaw, PLAY)) < 24; }

/* ---------- the about wall: the photos fan out while you face it ---------- */
var fan = document.getElementById('fan'), fanOpen = null;
function syncFan(){ var on = !intro && Math.abs(adiff(yaw, -58)) < 32; if (on !== fanOpen) { fanOpen = on; fan.classList.toggle('open', on); } }
var loopsOn = null;
function syncLoops(force){
  var on = !intro && !portalOpen && Math.abs(adiff(yaw, PLAY)) < 70;
  if (on === loopsOn && !force) return; loopsOn = on;
  playEls.forEach(function(e){
    var v = e.querySelector('video'); if (!v) return;
    if (on && PANELS[e._i].page === page) { v.preload = 'auto'; var pr = v.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else v.pause();
  });
}

/* ---------- head: where you look, and where you stand ---------- */
var yaw = -24, pitch = 0, yawT = 0, pitchT = 0, head = { x: 0, y: 0 }, cam = { x: 0, y: 0 }, push = 0, pushT = 0;
var P = 900, FINE = matchMedia('(pointer:fine)').matches, REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function fit(){
  /* phones zoom in so windows stay readable; you turn more to see the walls */
  P = innerWidth < 700 ? Math.min(innerWidth * 1.4, innerHeight * .75) : Math.max(360, Math.min(900, innerWidth * .62, innerHeight * .9));
  stage.style.perspective = P + 'px';
}
fit(); addEventListener('resize', fit);

var ROOMS = { contact: -114, about: -58, home: 0, work: 62, playground: 152 };
var OPEN_AT_LOAD = (function(){ var o = new URLSearchParams(location.search).get('open'); return o && /^(case\.html\?p=[\w-]+|about\.html)$/.test(o) ? o : null; })();
if (ROOMS[location.hash.slice(1)] != null) { yawT = ROOMS[location.hash.slice(1)]; yaw = yawT - 20; }
addEventListener('hashchange', function(){ var a = ROOMS[location.hash.slice(1)]; if (a != null) turnTo(a); });

var drag = null, moved = 0;
addEventListener('pointerdown', function(e){
  if (detailOpen || intro || portalOpen) return;
  drag = { x: e.clientX, y: e.clientY, yaw: yawT, pitch: pitchT }; moved = 0; gaze.classList.add('pinch');
});
addEventListener('pointermove', function(e){
  gaze.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  head.x = e.clientX / innerWidth - .5; head.y = e.clientY / innerHeight - .5;
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  yawT = drag.yaw - dx * .15; pitchT = clamp(drag.pitch + dy * .08, -14, 14);
});
addEventListener('pointerup', function(){ drag = null; gaze.classList.remove('pinch'); });

/* a trackpad pinch arrives as ctrl+wheel: pinch in on a window to bring it closer, pinch out to let it go */
addEventListener('wheel', function(e){
  if (portalOpen) return;
  if (intro) { e.preventDefault(); scrollIntro(e.deltaY * .0009); return; }
  if (detailOpen && !e.ctrlKey) return;
  e.preventDefault();
  if (e.ctrlKey) {
    if (e.deltaY < -2 && !detailOpen && hovered) open(hovered);
    else if (e.deltaY > 2 && detailOpen) close();
    return;
  }
  /* facing the work wall, scrolling up and down moves through the projects */
  if (nearPlay() && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    wheelAcc += e.deltaY; clearTimeout(wheelIdle); wheelIdle = setTimeout(function(){ wheelAcc = 0; }, 200);
    if (Math.abs(wheelAcc) > 70) { stepPage(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
    return;
  }
  if (nearWork() && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    /* scrolling moves one project at a time */
    wheelAcc += e.deltaY; clearTimeout(wheelIdle); wheelIdle = setTimeout(function(){ wheelAcc = 0; }, 200);
    if (Math.abs(wheelAcc) > 70) { step(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
    return;
  }
  yawT = yawT + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * .07;
}, { passive: false });
addEventListener('keydown', function(e){
  if (intro) {
    if (['ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); scrollIntro(.34); }
    if (['ArrowUp', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); scrollIntro(-.34); }
    return;
  }
  if (portalOpen) { if (e.key === 'Escape') closePortal(); return; }
  if (e.key === 'Escape' && detailOpen) close();
  if (detailOpen) return;
  if (e.key === 'ArrowRight') yawT += 24;
  if (e.key === 'ArrowLeft') yawT -= 24;
  if (nearWork() && e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (nearWork() && e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  if (nearPlay() && e.key === 'ArrowDown') { e.preventDefault(); stepPage(1); }
  if (nearPlay() && e.key === 'ArrowUp') { e.preventDefault(); stepPage(-1); }
});

/* ---------- windows: highlight, tilt, pinch ---------- */
var gaze = document.getElementById('gaze'), hovered = null;
els.forEach(function(el){
  var lift = el.querySelector('.lift'), face = el.querySelector('.face');
  el.addEventListener('pointerenter', function(){ hovered = el; el.classList.add('hover'); gaze.classList.add('big'); });
  el.addEventListener('pointerleave', function(){ if (hovered === el) hovered = null; el.classList.remove('hover'); gaze.classList.remove('big');
    lift.style.setProperty('--rx', '0deg'); lift.style.setProperty('--ry', '0deg'); });
  el.addEventListener('pointermove', function(e){
    /* project cards don't tilt or catch the light: they slide under the cursor while you scroll, and a tilt there
       means constant 3D re-sorting, which is what made them flicker */
    if (PANELS[el._i].stack) return;
    var r = el.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    lift.style.setProperty('--ry', ((u - .5) * 3).toFixed(2) + 'deg'); lift.style.setProperty('--rx', ((.5 - v) * 3).toFixed(2) + 'deg');
  });
  el.addEventListener('click', function(e){
    if (moved > 6) { e.preventDefault(); return; }
    if (e.target.closest('a[href]')) return;
    var go = e.target.closest('[data-go]');
    if (go) { turnTo(+go.getAttribute('data-go')); return; }
    var st = e.target.closest('[data-step]'), pk = e.target.closest('[data-pick]'), p = PANELS[el._i];
    if (st) { stepLock = 0; step(+st.getAttribute('data-step')); return; }
    var ps = e.target.closest('[data-pstep]'), pp = e.target.closest('[data-ppick]');
    if (ps) { pageLock = 0; stepPage(+ps.getAttribute('data-pstep')); return; }
    if (pp) { setPage(+pp.getAttribute('data-ppick')); return; }
    if (pk) { setCurrent(+pk.getAttribute('data-pick')); return; }
    if (p.kind === 'case' && p.ci !== current) { setCurrent(p.ci); return; }   /* a card waiting at the side comes forward */
    open(el);
  });
});

var orn = document.getElementById('orn'), brand = document.querySelector('.brand'), toplinks = document.getElementById('toplinks');
[orn, brand, toplinks].forEach(function(n){ n.addEventListener('pointerdown', function(e){ e.stopPropagation(); }); });
var ornTabs = [].slice.call(orn.querySelectorAll('button')), ornHeld = null;
/* the pill springs to the wall you pick and stays there while the room turns; dragging it turns the room as it passes each wall */
function pickWall(b){ if (!b) return; turnTo(+b.getAttribute('data-go')); ornHeld = { tab: b, yawT: yawT }; tabBar.set(b); mark(b); }
var tabBar = springNav(orn, { tabs: 'button', onOver: pickWall, onPick: pickWall });
orn.addEventListener('click', function(e){ pickWall(e.target.closest('button')); });
brand.addEventListener('click', function(e){ e.preventDefault(); turnTo(0); });
function turnTo(a){ yawT += adiff(a, yawT); pitchT = 0; }   /* the short way round */
function mark(t){ ornTabs.forEach(function(b){ b.classList.toggle('on', b === t); }); }
function syncOrn(){
  if (ornHeld && (ornHeld.yawT !== yawT || Math.abs(adiff(yawT, yaw)) < 12)) ornHeld = null;   /* arrived, or turned some other way */
  if (ornHeld || tabBar.dragging()) return;
  var best = null, bd = 1e9;
  ornTabs.forEach(function(b){ var d = Math.abs(adiff(+b.getAttribute('data-go'), yaw)); if (d < bd) { bd = d; best = b; } });
  tabBar.set(best); mark(best);
}

/* ---------- a pinched playground shot flies from the wall to right in front of you ---------- */
var detail = document.getElementById('detail'), dwin = document.getElementById('dwin'), detailOpen = null;
function rectOf(el){ return el.querySelector('.face').getBoundingClientRect(); }
function open(el){
  var p = PANELS[el._i];
  if (p.kind === 'case') { openPortal('case.html?p=' + CASES[p.ci].slug, el.querySelector('.face')); return; }
  if (p.kind !== 'play') return;
  detailOpen = el;
  var g = p.play;
  dwin.className = 'dwin is-shot';
  dwin.innerHTML = '<button class="close" id="dclose" aria-label="Close">✕</button><div class="dshot">' +
    (g.loop ? '<video autoplay muted loop playsinline poster="loops/' + g.loop + '.jpg" src="loops/' + g.loop + '.mp4"></video>' : '<img src="' + src(g.shot) + '" alt="' + esc(g.t) + '">') +
    '</div><p class="dcap"><b>' + esc(g.t) + '</b> ' + esc(g.by) + '</p>';
  detail.style.pointerEvents = ''; detail.classList.add('open'); document.body.classList.add('focus-mode'); pushT = 1;
  var a = rectOf(el), b = dwin.getBoundingClientRect();
  el.style.visibility = 'hidden';
  dwin.animate([
    { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')', opacity: .5 },
    { transform: 'none', opacity: 1 }
  ], { duration: 360, easing: 'cubic-bezier(.2,.9,.1,1)' });
}
function close(){
  if (!detailOpen) return;
  var el = detailOpen; detailOpen = null; pushT = 0;
  document.body.classList.remove('focus-mode');
  detail.style.pointerEvents = 'none';
  var a = rectOf(el), b = dwin.getBoundingClientRect();
  dwin.animate([
    { transform: 'none', opacity: 1 },
    { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')', opacity: .4 }
  ], { duration: 260, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = function(){ detail.classList.remove('open'); el.style.visibility = ''; };
}
detail.addEventListener('click', function(e){
  if (e.target === detail || e.target.closest('#dclose')) close();
});

/* ---------- pages open as a window in the room ----------
   Case studies and the about page load inside a big window that grows out of whatever you clicked.
   The room stays behind it; closing sends the window back and you are where you were. */
var portal = document.getElementById('portal'), pstack = document.getElementById('pstack'), pframe = document.getElementById('pframe');
var ptitle = document.getElementById('ptitle'), popen = document.getElementById('popen'), portalOpen = false, portalFrom = null;
function pageTitle(href){
  var m = /case\.html\?p=([\w-]+)/.exec(href), c = m && CASES.filter(function(x){ return x.slug === m[1]; })[0];
  return c ? '<b>' + c.name + '</b>&nbsp;· case study' : '<b>About</b>&nbsp;· Triumph Ohwojeheri';
}
function grow(fromRect, reverse, done){
  var b = pstack.getBoundingClientRect(), a = fromRect;
  var start = a ? 'translate(' + (a.left + a.width / 2 - (b.left + b.width / 2)) + 'px,' + (a.top + a.height / 2 - (b.top + b.height / 2)) + 'px) scale(' + Math.max(.2, a.width / b.width) + ') rotateX(8deg)'
                : 'translateY(40px) scale(.92) rotateX(10deg)';
  pstack.getAnimations().forEach(function(x){ x.onfinish = null; x.cancel(); });   /* a new open or close replaces one in flight */
  var frames = [{ transform: start, opacity: 0 }, { transform: 'none', opacity: 1 }];
  var an = pstack.animate(reverse ? frames.reverse() : frames, { duration: reverse ? 360 : 560, easing: reverse ? 'cubic-bezier(.4,0,.2,1)' : 'cubic-bezier(.2,.9,.1,1)' });
  if (done) an.onfinish = done;
}
function openPortal(href, fromEl, fromHistory){
  if (detailOpen) { var d = detailOpen; detailOpen = null; detail.classList.remove('open'); d.style.visibility = ''; document.body.classList.remove('focus-mode'); }
  portalFrom = fromEl ? fromEl.getBoundingClientRect() : null;
  /* replace(), not src: loading pages in the window shouldn't add steps to the back button */
  pframe.contentWindow.location.replace(href + (href.indexOf('?') < 0 ? '?' : '&') + 'embed=1');
  ptitle.innerHTML = pageTitle(href); popen.href = href;
  portal.classList.add('open'); document.body.classList.add('portal-open'); portalOpen = true; pushT = 1;
  grow(portalFrom, false);
  if (!fromHistory) history.pushState({ portal: href }, '', '?open=' + encodeURIComponent(href) + location.hash);
  setTimeout(function(){ pclose.focus(); }, 50);
}
function closePortal(fromHistory, hash){
  if (!portalOpen) return;
  portalOpen = false; pushT = 0; document.body.classList.remove('portal-open');
  grow(portalFrom, true, function(){ if (portalOpen) return; portal.classList.remove('open'); pframe.contentWindow.location.replace('about:blank'); });
  if (!fromHistory) history.pushState({}, '', location.pathname + (hash ? '#' + hash : location.hash));
  if (hash && ROOMS[hash] != null) turnTo(ROOMS[hash]);
}
var pclose = document.getElementById('pclose');
pclose.addEventListener('click', function(){ closePortal(); });
portal.addEventListener('click', function(e){ if (e.target === portal) closePortal(); });
addEventListener('popstate', function(e){
  var href = e.state && e.state.portal;
  if (href) openPortal(href, null, true); else closePortal(true);
});
/* any link to a case study or the about page opens in the room instead of leaving it */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href^="case.html"], a[href^="about.html"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  if (moved > 6) { e.preventDefault(); return; }
  e.preventDefault(); e.stopPropagation();
  openPortal(a.getAttribute('href'), a.closest('.panel') ? a.closest('.panel').querySelector('.face') : a.closest('.dwin') || a);
}, true);
/* the page inside the window asks to come back to the room (its "Room" and "All work" links), or tells us where it went */
addEventListener('message', function(e){
  var m = e.data || {};
  if (m.type === 'room') closePortal(false, m.hash);
  if (m.type === 'page' && portalOpen) { ptitle.innerHTML = pageTitle(m.href); popen.href = m.href; history.replaceState({ portal: m.href }, '', '?open=' + encodeURIComponent(m.href) + location.hash); }
});
if (OPEN_AT_LOAD) setTimeout(function(){ history.replaceState({ portal: OPEN_AT_LOAD }, '', location.href); openPortal(OPEN_AT_LOAD, null, true); }, 300);

/* ---------- Lagos time ---------- */
var clock = document.getElementById('clock');
function tick(){ if (clock) clock.textContent = 'Lagos ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Lagos', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); }
tick(); setInterval(tick, 30000);

/* ---------- intro: the name as particles; scrolling dissolves it, shows the room from above, then brings you down into it ---------- */
var intro = !REDUCE && ROOMS[location.hash.slice(1)] == null && !OPEN_AT_LOAD;
var introEl = document.getElementById('intro'), icv = document.getElementById('introCv'), ictx = icv.getContext('2d');
var introSub = document.getElementById('introSub'), introCue = document.getElementById('introCue');
var ip = 0, ipT = 0, lastScroll = 0, lastT = 0, PTS = [], IW = 0, IH = 0, IDPR = Math.min(2, devicePixelRatio || 1), pstep = 4, ink = '#fff';
var mouse = { x: -1e4, y: -1e4 };
function ss(a, b, x){ x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function inOut(x){ return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function readInk(){ ink = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#fff'; }
function scrollIntro(d){ ipT = clamp(ipT + d, 0, 1); lastScroll = performance.now(); }
function buildName(){
  IW = innerWidth; IH = innerHeight;
  icv.width = IW * IDPR; icv.height = IH * IDPR; ictx.setTransform(IDPR, 0, 0, IDPR, 0, 0);
  var FONT = 'px "Helvetica Neue", Helvetica, Inter, Arial, sans-serif', oc = document.createElement('canvas'), g = oc.getContext('2d');
  oc.width = IW; oc.height = IH;
  /* fit the name to the screen: about 72% of the width on desktop, 88% on phones */
  g.font = '600 100' + FONT;
  var fs = Math.min(300, 100 * IW * (IW < 700 ? .88 : .72) / g.measureText('Triumph').width);
  g.font = '600 ' + fs + FONT;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';
  g.fillText('Triumph', IW / 2, IH * .44);
  var px = g.getImageData(0, 0, IW, IH).data;
  pstep = Math.max(2, Math.round(fs / 62)); PTS = [];
  for (var y = 0; y < IH; y += pstep) for (var x = 0; x < IW; x += pstep) {
    if (px[(y * IW + x) * 4 + 3] < 128) continue;
    var a = Math.random() * 6.283, s = .35 + Math.random();
    /* each particle gets its own direction to drift in when the name dissolves */
    PTS.push({ hx: x + (Math.random() - .5) * pstep * .8, hy: y + (Math.random() - .5) * pstep * .8, ox: 0, oy: 0, vx: 0, vy: 0, c: Math.random() < .14, sz: pstep * (.35 + Math.random() * .45),
      ax: Math.cos(a) * s, ay: Math.sin(a) * s - .7, n: Math.random() * 6.283, z: .5 + Math.random() * .8 });
  }
  introSub.style.top = (IH * .44 + fs * .6) + 'px';
}
function finishIntro(){
  intro = false; ip = ipT = 1;
  document.body.classList.remove('intro'); stage.style.opacity = ''; ceilA = 1; lastWT = '';
  introEl.style.transition = 'opacity .4s'; introEl.style.opacity = 0;
  setTimeout(function(){ introEl.remove(); }, 450);
}
if (intro) {
  readInk(); buildName();
  addEventListener('resize', function(){ if (intro) buildName(); });
  document.getElementById('introSkip').addEventListener('click', function(){ ipT = 1; ip = .99; });
  introEl.addEventListener('pointerleave', function(){ mouse.x = mouse.y = -1e4; });
  var ty = null;
  addEventListener('touchstart', function(e){ ty = e.touches[0].clientY; mouse.x = e.touches[0].clientX; mouse.y = ty; }, { passive: true });
  addEventListener('touchmove', function(e){
    if (!intro) return;
    var y = e.touches[0].clientY; mouse.x = e.touches[0].clientX; mouse.y = y;
    if (ty != null) scrollIntro((ty - y) * .0028); ty = y; e.preventDefault();
  }, { passive: false });
  addEventListener('touchend', function(){ ty = null; mouse.x = mouse.y = -1e4; });
} else { document.body.classList.remove('intro'); introEl.remove(); }

function introFrame(t){
  var dt = Math.min(.05, lastT ? (t - lastT) / 1000 : .016); lastT = t;
  /* once you're past the halfway point and stop scrolling, finish the descent for you */
  if (ipT > .45 && ipT < 1 && performance.now() - lastScroll > 650) ipT = 1;
  ip += (ipT - ip) * .085;

  /* 1 · the name: a spring holds each particle home; the cursor pushes them away; scrolling lets them drift off */
  var e = ss(0, .3, ip);
  ictx.clearRect(0, 0, IW, IH);
  if (e < 1) {
    /* a soft spring: particles blown away by the cursor drift back slowly, like dust settling */
    var CR = Math.max(90, pstep * 30), CR2 = CR * CR, K = 6, C = 2 * Math.sqrt(K) * .45;
    for (var i = 0; i < PTS.length; i++) {
      var p = PTS[i], x = p.hx + p.ox, y = p.hy + p.oy, dx = x - mouse.x, dy = y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < CR2) {
        var d = Math.sqrt(d2) + .1, f = 1 - d / CR; f *= f;
        p.vx += (dx / d * 2600 * f + (Math.random() - .5) * 2200 * f) * dt;
        p.vy += (dy / d * 2600 * f + (Math.random() - .5) * 2200 * f - 900 * f) * dt;
      }
      p.vx += (-K * p.ox - C * p.vx + Math.sin(t * .003 + p.n) * 4) * dt; p.vy += (-K * p.oy - C * p.vy) * dt;
      p.ox += p.vx * dt; p.oy += p.vy * dt;
      var away = Math.min(1, Math.sqrt(p.ox * p.ox + p.oy * p.oy) / 90);
      var sx = (p.ax * IW * .5 + Math.sin(t * .0012 + p.n) * 40) * e * p.z, sy = p.ay * IH * .55 * e * p.z;
      ictx.globalAlpha = (1 - e) * (1 - away * .8) * (.75 + .25 * Math.sin(t * .002 + p.n));
      ictx.fillStyle = p.c ? '#5b3fd6' : ink;   /* a few grains of brand purple in the dust */
      ictx.fillRect(x + sx, y + sy, p.sz, p.sz);
    }
    ictx.globalAlpha = 1;
  }
  var ui = 1 - ss(0, .12, ip);
  introSub.style.opacity = ui; introCue.style.opacity = ui;
  introEl.style.pointerEvents = ip > .3 ? 'none' : '';

  /* 2 · the room fades in from straight above, a circle on the floor */
  stage.style.opacity = ss(.06, .3, ip).toFixed(3);
  /* 3 · the camera cranes down: tilting from looking straight down to level, coming closer, turning to face the intro window */
  var k = inOut(ss(.24, 1, ip)), up = 1 - k;
  var DIST = Math.max(1800, RW * P / (Math.min(innerWidth, innerHeight) * .42) - FLOOR);
  ceilA = ss(.8, 1, ip);
  setCamera(0, 0, -90 * up, -70 * up, P - DIST * up);
  if (ip > .992 && ipT >= 1) finishIntro();
}

/* ---------- loop: turn toward where you're looking, and lean a little with the pointer so near things move more than far ones ---------- */
var hint = document.getElementById('hint'), hintGone = false;
var lastWT = '';
/* the windows (CSS 3D) and the room (canvas) share one camera; nothing is redrawn while it stands still */
function setCamera(cx, cy, xr, yr, tz){
  var wt = 'translateZ(' + tz.toFixed(2) + 'px) translate3d(' + (-cx).toFixed(2) + 'px,' + (-cy).toFixed(2) + 'px,0) rotateX(' + xr.toFixed(3) + 'deg) rotateY(' + yr.toFixed(3) + 'deg)';
  if (wt === lastWT) return;
  lastWT = wt; world.style.transform = wt;
  CAM.cx = +cx.toFixed(2); CAM.cy = +cy.toFixed(2); CAM.xr = +xr.toFixed(3); CAM.yr = +yr.toFixed(3); CAM.tz = +tz.toFixed(2);
  drawRoom();
}
function frame(t){
  if (intro) { introFrame(t); requestAnimationFrame(frame); return; }
  var calm = detailOpen || REDUCE;
  var hx = calm ? 0 : head.x, hy = calm ? 0 : head.y;
  yaw += (yawT + (FINE ? hx * 6 : 0) - yaw) * .17; pitch += (pitchT - (FINE ? hy * 4 : 0) - pitch) * .17; push += (pushT - push) * .2;
  cam.x += ((FINE ? hx * 150 : 0) - cam.x) * .08; cam.y += ((FINE ? hy * 70 : 0) - cam.y) * .08;
  setCamera(cam.x, cam.y, -pitch, yaw, P - push * 260);
  syncOrn(); syncLoops(); syncFan();
  if (window.meter) { var hd = ((yaw % 360) + 540) % 360 - 180, wall = ornTabs.filter(function(b){ return b.classList.contains('on'); })[0];
    meter((hd + 180) / 360, (wall ? wall.textContent + '  ' : '') + Math.round((hd + 360) % 360) + '°'); }
  if (!hintGone && Math.abs(yawT) > 15) { hintGone = true; hint.style.opacity = 0; }
  requestAnimationFrame(frame);
}
placePage();
requestAnimationFrame(frame);
})();
</script>
