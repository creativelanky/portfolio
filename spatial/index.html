<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Triumph Ohwojeheri — Product Designer"><meta property="og:description" content="Complex ideas. Thoughtfully simple experiences."><meta property="og:image" content="https://thetriumph.xyz/social-thumbnail.png"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../Favicon.avif">
<script>try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="stylesheet" href="space.css">

</head>
<body class="room intro">
<div class="stage" id="stage"><div class="world" id="world"></div></div>

<div class="hint" id="hint">Drag to look around. Click a window, or pinch on a trackpad, to bring it closer.</div>
<a class="brand" href="#" aria-label="Triumph Ohwojeheri, home"><span class="mono">t.</span><span>Triumph<br>Ohwojeheri</span></a>
<button class="theme" id="theme" aria-label="Switch light or dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<nav class="orn" id="orn" aria-label="Rooms">
  <button data-go="-114">Contact</button>
  <button data-go="-58">About</button>
  <button data-go="0" class="on">Home</button>
  <button data-go="62">Work</button>
  <button data-go="152">Playground</button>

<div class="detail" id="detail" role="dialog" aria-modal="true"><div class="dwin" id="dwin"></div></div>
<div class="intro" id="intro" aria-label="Triumph Ohwojeheri">
  <canvas id="introCv" aria-hidden="true"></canvas>
  <p class="intro-sub" id="introSub">Product designer in Lagos</p>
  <div class="intro-cue" id="introCue"><span>Scroll to enter</span><i></i></div>
  <button class="intro-skip" id="introSkip">Skip intro</button>
</div>
<div class="gaze" id="gaze"></div>

<script>
(function(){
"use strict";
function src(f){ return '../' + encodeURI(f); }
function th(f){ return 'thumbs/' + encodeURI(f); }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

/* ---------- the room's dimensions (px, the viewer's eye is at 0,0,0) ---------- */
var R = 1000, FLOOR = 520, CEIL = -760, RW = 2100, RP = 1420;

/* ---------- what hangs where. ang: degrees around you (negative = left); y: height; z: nearer (+) or further (-) ---------- */
var PANELS = [
  { ang: 0, y: -20, w: 660, h: 420, d: .1, kind: 'hero',
    html: '<div class="in"><div class="top"><span class="small">Independent product designer, Lagos</span><span class="avail"><i></i>Available for select projects</span></div>' +
          '<div class="h1">Complex ideas.<br><em>Thoughtfully</em> simple.</div>' +
          '<div class="p">I’m Triumph. I turn complex problems into digital experiences that feel right. From Web3 to the everyday.</div>' +
          '<div class="row"><span class="btn pri" data-go="62">View selected work</span><span class="btn" data-go="-114">Get in touch</span></div></div>' }
];
var COLS = [32, 62, 92], ROWS = [-185, 185], DEPTH = [20, -20, 10, -10, 25, -15];
CASES.forEach(function(c, i){
  PANELS.push({ ang: COLS[i % 3], y: ROWS[Math.floor(i / 3)], z: DEPTH[i], w: 480, h: 330, d: .2 + i * .05, kind: 'case', ci: i,
    html: '<div class="in"><div class="shot-img"><img src="' + th(c.thumb) + '" alt="' + esc(c.name) + '" draggable="false"></div>' +
          '<div class="bar"><div><b>' + c.name + '</b><br><span>' + c.tagline + '</span></div><span class="meta">' + c.category + ' · ' + c.year + '</span></div></div>' });
});
SHOTS.forEach(function(s, i){
  PANELS.push({ ang: [130, 152, 174][i % 3], y: i < 3 ? -125 : 125, z: i % 2 ? -20 : 10, w: 320, h: 225, d: .5 + i * .04, kind: 'shot', shot: s,
    html: '<div class="shot"><img src="' + th(s) + '" alt="UI shot" draggable="false"></div>' });
});
PANELS.push(
  { ang: -42, y: -10, w: 320, h: 440, d: .3, z: -10, kind: 'about',
    html: '<div class="portrait"><img src="' + th('photo-3.jpg') + '" alt="Triumph Ohwojeheri" draggable="false"><div class="cap"><b>Triumph Ohwojeheri</b><span>Product designer, Lagos</span></div></div>' },
  { ang: -72, y: -135, w: 440, h: 250, d: .35, kind: 'about',
    html: '<div class="in"><span class="small">About</span><div class="h2" style="margin-top:12px;font-size:28px">Curious by nature.<br>Intentional by design.</div>' +
          '<div class="p" style="font-size:14px">I’m a product designer in Lagos, working at the intersection of clarity, utility and a little unexpected delight.</div></div>' },
  { ang: -72, y: 150, w: 440, h: 290, d: .4, kind: 'about',
    html: '<div class="in"><span class="small">Background</span><dl class="facts">' +
          '<div><dt>Designing products</dt><dd>4 years</dd></div><div><dt>Projects</dt><dd>20+</dd></div>' +
          '<div><dt>Worked with</dt><dd>Silk, Bitazza, Kryptos, Dreamspace, Human Tech</dd></div><div><dt>Focus</dt><dd>Web3, fintech, AI</dd></div></dl>' +
          '<div class="p" style="font-size:13px;margin-top:auto">On the side, I vibe-code my designs to life, end to end.</div></div>' },
  { ang: -114, y: -10, w: 480, h: 380, d: .45, kind: 'contact',
    html: '<div class="in"><span class="small">Have something in mind?</span><div class="h1 md">Let’s make it<br>something good.</div>' +
          '<a class="mail" href="mailto:triumphohwojeheri@gmail.com">triumphohwojeheri@gmail.com</a>' +
          '<div class="row"><a class="btn pri" href="mailto:triumphohwojeheri@gmail.com">Email me</a><a class="btn" href="https://calendly.com/triumphohwojeheri/30min" target="_blank" rel="noopener">Book a call</a></div>' +
          '<div class="socials"><a href="https://twitter.com/amazinglanky" target="_blank" rel="noopener">X</a><a href="https://instagram.com/amazinglanky" target="_blank" rel="noopener">Instagram</a><a href="https://dribbble.com/amazinglanky" target="_blank" rel="noopener">Dribbble</a><a href="https://linkedin.com/in/triumph-ohwojeheri" target="_blank" rel="noopener">LinkedIn</a><span class="clock" id="clock"></span></div></div>' }
);
var LABELS = [{ t: 'Selected work', ang: 62, y: -400 }, { t: 'Playground', ang: 152, y: -290 }, { t: 'About', ang: -58, y: -320 }, { t: 'Contact', ang: -114, y: -250 }];

/* ---------- build ---------- */
var stage = document.getElementById('stage'), world = document.getElementById('world');
function put(cls, w, h, transform, html){
  var e = document.createElement('div'); e.className = cls;
  e.style.width = w + 'px'; e.style.height = h + 'px'; e.style.left = -w / 2 + 'px'; e.style.top = -h / 2 + 'px';
  e.style.transform = transform; if (html) e.innerHTML = html;
  world.appendChild(e); return e;
}
/* floor, ceiling with a ring light, a curved gallery wall, pillars between the rooms */
put('floor', 2 * RW + 240, 2 * RW + 240, 'translateY(' + FLOOR + 'px) rotateX(90deg)');
/* a ring inlaid in the floor where the windows stand: from above, the room reads as a circle */
put('floor-ring', 2 * R + 120, 2 * R + 120, 'translateY(' + (FLOOR - 1) + 'px) rotateX(90deg)');
var ceil = put('ceiling', 5600, 5600, 'translateY(' + CEIL + 'px) rotateX(-90deg)');
ceil.innerHTML = '<div class="ring" style="width:3000px;height:3000px;left:1300px;top:1300px"></div>';
var N = 48, SEG = 2 * RW * Math.tan(Math.PI / N) + 2, WH = FLOOR - CEIL;
for (var k = 0; k < N; k++) put('wall', SEG, WH, 'rotateY(' + (k * 360 / N) + 'deg) translate3d(0,' + (CEIL + WH / 2) + 'px,' + (-RW) + 'px)');
[-88, -27, 113].forEach(function(a){ put('pillar', 90, WH, 'rotateY(' + (-a) + 'deg) translate3d(0,' + (CEIL + WH / 2) + 'px,' + (-RP) + 'px)'); });
/* light falling on the floor in front of each wall */
[[0, 1500, 900], [62, 2000, 1000], [152, 1500, 800], [-58, 1400, 800], [-114, 1100, 700]].forEach(function(p){
  put('pool', p[1], p[2], 'rotateY(' + (-p[0]) + 'deg) translate3d(0,' + (FLOOR - 1) + 'px,' + (-R) + 'px) rotateX(90deg)');
});

var els = PANELS.map(function(p, i){
  var e = put('panel k-' + p.kind, p.w, p.h, 'rotateY(' + (-p.ang) + 'deg) translate3d(0,' + p.y + 'px,' + (-(R - (p.z || 0))) + 'px)',
    '<div class="lift" style="--d:' + p.d.toFixed(2) + 's"><div class="back"></div><div class="face">' + p.html + '</div></div><div class="grab"></div>');
  e._i = i;
  /* each window casts a soft shadow on the floor below it */
  put('fshadow', p.w * 1.05, 160, 'rotateY(' + (-p.ang) + 'deg) translate3d(0,' + (FLOOR - 2) + 'px,' + (-(R - (p.z || 0)) + 40) + 'px) rotateX(90deg)').style.opacity = Math.max(.25, 1 - (FLOOR - (p.y + p.h / 2)) / 900);
  return e;
});
LABELS.forEach(function(l){
  var e = document.createElement('div'); e.className = 'label'; e.textContent = l.t;
  e.style.transform = 'rotateY(' + (-l.ang) + 'deg) translate3d(-50%,' + l.y + 'px,' + (-R) + 'px)';
  world.appendChild(e);
});

/* ---------- head: where you look, and where you stand ---------- */
var yaw = -24, pitch = 0, yawT = 0, pitchT = 0, head = { x: 0, y: 0 }, cam = { x: 0, y: 0 }, push = 0, pushT = 0;
var P = 900, YMIN = -132, YMAX = 178, FINE = matchMedia('(pointer:fine)').matches, REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function fit(){
  /* phones zoom in so windows stay readable; you turn more to see the walls */
  P = innerWidth < 700 ? Math.min(innerWidth * 1.4, innerHeight * .75) : Math.max(360, Math.min(900, innerWidth * .62, innerHeight * .9));
  stage.style.perspective = P + 'px';
}
fit(); addEventListener('resize', fit);

var ROOMS = { contact: -114, about: -58, home: 0, work: 62, playground: 152 };
if (ROOMS[location.hash.slice(1)] != null) { yawT = ROOMS[location.hash.slice(1)]; yaw = yawT - 20; }
addEventListener('hashchange', function(){ var a = ROOMS[location.hash.slice(1)]; if (a != null) turnTo(a); });

var drag = null, moved = 0;
addEventListener('pointerdown', function(e){
  if (detailOpen || intro) return;
  drag = { x: e.clientX, y: e.clientY, yaw: yawT, pitch: pitchT }; moved = 0; gaze.classList.add('pinch');
});
addEventListener('pointermove', function(e){
  gaze.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  head.x = e.clientX / innerWidth - .5; head.y = e.clientY / innerHeight - .5;
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  yawT = clamp(drag.yaw - dx * .15, YMIN, YMAX); pitchT = clamp(drag.pitch + dy * .08, -14, 14);
});
addEventListener('pointerup', function(){ drag = null; gaze.classList.remove('pinch'); });

/* a trackpad pinch arrives as ctrl+wheel: pinch in on a window to bring it closer, pinch out to let it go */
addEventListener('wheel', function(e){
  if (intro) { e.preventDefault(); scrollIntro(e.deltaY * .0009); return; }
  if (detailOpen && !e.ctrlKey) return;
  e.preventDefault();
  if (e.ctrlKey) {
    if (e.deltaY < -2 && !detailOpen && hovered) open(hovered);
    else if (e.deltaY > 2 && detailOpen) close();
    return;
  }
  yawT = clamp(yawT + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * .07, YMIN, YMAX);
}, { passive: false });
addEventListener('keydown', function(e){
  if (intro) {
    if (['ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); scrollIntro(.34); }
    if (['ArrowUp', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); scrollIntro(-.34); }
    return;
  }
  if (e.key === 'Escape' && detailOpen) close();
  if (detailOpen) return;
  if (e.key === 'ArrowRight') yawT = clamp(yawT + 24, YMIN, YMAX);
  if (e.key === 'ArrowLeft') yawT = clamp(yawT - 24, YMIN, YMAX);
});

/* ---------- windows: highlight, tilt, pinch ---------- */
var gaze = document.getElementById('gaze'), hovered = null;
els.forEach(function(el){
  var lift = el.querySelector('.lift'), face = el.querySelector('.face');
  el.addEventListener('pointerenter', function(){ hovered = el; el.classList.add('hover'); gaze.classList.add('big'); });
  el.addEventListener('pointerleave', function(){ if (hovered === el) hovered = null; el.classList.remove('hover'); gaze.classList.remove('big');
    lift.style.setProperty('--rx', '0deg'); lift.style.setProperty('--ry', '0deg'); });
  el.addEventListener('pointermove', function(e){
    var r = el.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    face.style.setProperty('--mx', u * 100 + '%'); face.style.setProperty('--my', v * 100 + '%');
    lift.style.setProperty('--ry', ((u - .5) * 7).toFixed(2) + 'deg'); lift.style.setProperty('--rx', ((.5 - v) * 7).toFixed(2) + 'deg');
  });
  el.addEventListener('click', function(e){
    if (moved > 6) { e.preventDefault(); return; }
    if (e.target.closest('a[href]')) return;
    var go = e.target.closest('[data-go]');
    if (go) { turnTo(+go.getAttribute('data-go')); return; }
    open(el);
  });
});

var orn = document.getElementById('orn'), brand = document.querySelector('.brand'), themeBtn = document.getElementById('theme');
[orn, brand, themeBtn].forEach(function(n){ n.addEventListener('pointerdown', function(e){ e.stopPropagation(); }); });
orn.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) turnTo(+b.getAttribute('data-go')); });
brand.addEventListener('click', function(e){ e.preventDefault(); turnTo(0); });
themeBtn.addEventListener('click', function(){
  var t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (er) {}
});
function turnTo(a){ yawT = a; pitchT = 0; }
function syncOrn(){
  var best = null, bd = 1e9;
  [].forEach.call(orn.children, function(b){ var d = Math.abs(+b.getAttribute('data-go') - yaw); if (d < bd) { bd = d; best = b; } });
  [].forEach.call(orn.children, function(b){ b.classList.toggle('on', b === best); });
}

/* ---------- a pinched window flies from the wall to right in front of you ---------- */
var detail = document.getElementById('detail'), dwin = document.getElementById('dwin'), detailOpen = null;
function caseView(i){
  var c = CASES[i], nx = (i + 1) % CASES.length;
  return '<div class="dcase"><div class="dimg' + (c.heroContain ? ' contain' : '') + '"><img src="' + src(c.thumb) + '" alt="' + esc(c.name) + '"></div>' +
    '<div class="dtext"><div><div class="small">' + c.category + ' · ' + c.year + '</div><h2 style="margin-top:10px">' + c.name + '</h2><p class="p">' + c.summary + '</p></div>' +
    '<div><dl>' + c.meta.slice(0, 3).map(function(m){ return '<div><dt>' + m[0] + '</dt><dd>' + m[1] + '</dd></div>'; }).join('') + '</dl>' +
    '<div class="row"><a class="btn pri" href="case.html?p=' + c.slug + '">Read the case study</a><button class="btn" data-next="' + nx + '">Next: ' + CASES[nx].name + '</button></div></div></div></div>';
}
function rectOf(el){ return el.querySelector('.face').getBoundingClientRect(); }
function open(el){
  var p = PANELS[el._i], html;
  if (p.kind === 'case') html = caseView(p.ci);
  else if (p.kind === 'shot') html = '<div class="dshot"><img src="' + src(p.shot) + '" alt="UI shot"></div>';
  else return;
  detailOpen = el;
  dwin.className = 'dwin' + (p.kind === 'shot' ? ' is-shot' : '');
  dwin.innerHTML = '<button class="close" id="dclose" aria-label="Close">✕</button>' + html;
  detail.style.pointerEvents = ''; detail.classList.add('open'); document.body.classList.add('focus-mode'); pushT = 1;
  var a = rectOf(el), b = dwin.getBoundingClientRect();
  el.style.visibility = 'hidden';
  dwin.animate([
    { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')', opacity: .5 },
    { transform: 'none', opacity: 1 }
  ], { duration: 360, easing: 'cubic-bezier(.2,.9,.1,1)' });
}
function close(){
  if (!detailOpen) return;
  var el = detailOpen; detailOpen = null; pushT = 0;
  document.body.classList.remove('focus-mode');
  detail.style.pointerEvents = 'none';
  var a = rectOf(el), b = dwin.getBoundingClientRect();
  dwin.animate([
    { transform: 'none', opacity: 1 },
    { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')', opacity: .4 }
  ], { duration: 260, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = function(){ detail.classList.remove('open'); el.style.visibility = ''; };
}
detail.addEventListener('click', function(e){
  if (e.target === detail || e.target.closest('#dclose')) { close(); return; }
  var nx = e.target.closest('[data-next]');
  if (nx) {
    /* swap the window's contents in place, and turn the room so the next project is behind it */
    var i = +nx.getAttribute('data-next'), target = els.filter(function(x){ return PANELS[x._i].ci === i; })[0];
    detailOpen.style.visibility = ''; detailOpen = target; target.style.visibility = 'hidden';
    yawT = PANELS[target._i].ang;
    dwin.querySelector('.dcase').outerHTML = caseView(i);
    dwin.animate([{ opacity: .3, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.9,.1,1)' });
  }
});

/* ---------- Lagos time ---------- */
var clock = document.getElementById('clock');
function tick(){ if (clock) clock.textContent = 'Lagos ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Lagos', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); }
tick(); setInterval(tick, 30000);

/* ---------- intro: the name as particles; scrolling dissolves it, shows the room from above, then brings you down into it ---------- */
var intro = !REDUCE && ROOMS[location.hash.slice(1)] == null;
var introEl = document.getElementById('intro'), icv = document.getElementById('introCv'), ictx = icv.getContext('2d');
var introSub = document.getElementById('introSub'), introCue = document.getElementById('introCue');
var ip = 0, ipT = 0, lastScroll = 0, lastT = 0, PTS = [], IW = 0, IH = 0, IDPR = Math.min(2, devicePixelRatio || 1), pstep = 4, ink = '#fff';
var mouse = { x: -1e4, y: -1e4 };
function ss(a, b, x){ x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function inOut(x){ return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function readInk(){ ink = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#fff'; }
function scrollIntro(d){ ipT = clamp(ipT + d, 0, 1); lastScroll = performance.now(); }
function buildName(){
  IW = innerWidth; IH = innerHeight;
  icv.width = IW * IDPR; icv.height = IH * IDPR; ictx.setTransform(IDPR, 0, 0, IDPR, 0, 0);
  var FONT = 'px "Helvetica Neue", Helvetica, Inter, Arial, sans-serif', oc = document.createElement('canvas'), g = oc.getContext('2d');
  oc.width = IW; oc.height = IH;
  /* fit the name to the screen: about 72% of the width on desktop, 88% on phones */
  g.font = '600 100' + FONT;
  var fs = Math.min(300, 100 * IW * (IW < 700 ? .88 : .72) / g.measureText('Triumph').width);
  g.font = '600 ' + fs + FONT;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';
  g.fillText('Triumph', IW / 2, IH * .44);
  var px = g.getImageData(0, 0, IW, IH).data;
  pstep = Math.max(2, Math.round(fs / 62)); PTS = [];
  for (var y = 0; y < IH; y += pstep) for (var x = 0; x < IW; x += pstep) {
    if (px[(y * IW + x) * 4 + 3] < 128) continue;
    var a = Math.random() * 6.283, s = .35 + Math.random();
    /* each particle gets its own direction to drift in when the name dissolves */
    PTS.push({ hx: x + (Math.random() - .5) * pstep * .8, hy: y + (Math.random() - .5) * pstep * .8, ox: 0, oy: 0, vx: 0, vy: 0, sz: pstep * (.35 + Math.random() * .45),
      ax: Math.cos(a) * s, ay: Math.sin(a) * s - .7, n: Math.random() * 6.283, z: .5 + Math.random() * .8 });
  }
  introSub.style.top = (IH * .44 + fs * .6) + 'px';
}
function finishIntro(){
  intro = false; ip = ipT = 1;
  document.body.classList.remove('intro'); stage.style.opacity = ''; ceil.style.opacity = '';
  introEl.style.transition = 'opacity .4s'; introEl.style.opacity = 0;
  setTimeout(function(){ introEl.remove(); }, 450);
}
if (intro) {
  readInk(); buildName();
  addEventListener('resize', function(){ if (intro) buildName(); });
  themeBtn.addEventListener('click', function(){ setTimeout(readInk, 0); });
  document.getElementById('introSkip').addEventListener('click', function(){ ipT = 1; ip = .99; });
  introEl.addEventListener('pointerleave', function(){ mouse.x = mouse.y = -1e4; });
  var ty = null;
  addEventListener('touchstart', function(e){ ty = e.touches[0].clientY; mouse.x = e.touches[0].clientX; mouse.y = ty; }, { passive: true });
  addEventListener('touchmove', function(e){
    if (!intro) return;
    var y = e.touches[0].clientY; mouse.x = e.touches[0].clientX; mouse.y = y;
    if (ty != null) scrollIntro((ty - y) * .0028); ty = y; e.preventDefault();
  }, { passive: false });
  addEventListener('touchend', function(){ ty = null; mouse.x = mouse.y = -1e4; });
} else { document.body.classList.remove('intro'); introEl.remove(); }

function introFrame(t){
  var dt = Math.min(.05, lastT ? (t - lastT) / 1000 : .016); lastT = t;
  /* once you're past the halfway point and stop scrolling, finish the descent for you */
  if (ipT > .45 && ipT < 1 && performance.now() - lastScroll > 650) ipT = 1;
  ip += (ipT - ip) * .085;

  /* 1 · the name: a spring holds each particle home; the cursor pushes them away; scrolling lets them drift off */
  var e = ss(0, .3, ip);
  ictx.clearRect(0, 0, IW, IH);
  if (e < 1) {
    ictx.fillStyle = ink;
    /* a soft spring: particles blown away by the cursor drift back slowly, like dust settling */
    var CR = Math.max(90, pstep * 30), CR2 = CR * CR, K = 6, C = 2 * Math.sqrt(K) * .45;
    for (var i = 0; i < PTS.length; i++) {
      var p = PTS[i], x = p.hx + p.ox, y = p.hy + p.oy, dx = x - mouse.x, dy = y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < CR2) {
        var d = Math.sqrt(d2) + .1, f = 1 - d / CR; f *= f;
        p.vx += (dx / d * 2600 * f + (Math.random() - .5) * 2200 * f) * dt;
        p.vy += (dy / d * 2600 * f + (Math.random() - .5) * 2200 * f - 900 * f) * dt;
      }
      p.vx += (-K * p.ox - C * p.vx + Math.sin(t * .003 + p.n) * 4) * dt; p.vy += (-K * p.oy - C * p.vy) * dt;
      p.ox += p.vx * dt; p.oy += p.vy * dt;
      var away = Math.min(1, Math.sqrt(p.ox * p.ox + p.oy * p.oy) / 90);
      var sx = (p.ax * IW * .5 + Math.sin(t * .0012 + p.n) * 40) * e * p.z, sy = p.ay * IH * .55 * e * p.z;
      ictx.globalAlpha = (1 - e) * (1 - away * .8) * (.75 + .25 * Math.sin(t * .002 + p.n));
      ictx.fillRect(x + sx, y + sy, p.sz, p.sz);
    }
    ictx.globalAlpha = 1;
  }
  var ui = 1 - ss(0, .12, ip);
  introSub.style.opacity = ui; introCue.style.opacity = ui;
  introEl.style.pointerEvents = ip > .3 ? 'none' : '';

  /* 2 · the room fades in from straight above, a circle on the floor */
  stage.style.opacity = ss(.06, .3, ip).toFixed(3);
  /* 3 · the camera cranes down: tilting from looking straight down to level, coming closer, turning to face the intro window */
  var k = inOut(ss(.24, 1, ip)), up = 1 - k;
  var DIST = Math.max(1800, RW * P / (Math.min(innerWidth, innerHeight) * .42) - FLOOR);
  ceil.style.opacity = ss(.8, 1, ip).toFixed(3);
  world.style.transform = 'translateZ(' + (P - DIST * up).toFixed(1) + 'px) rotateX(' + (-90 * up).toFixed(2) + 'deg) rotateY(' + (-70 * up).toFixed(2) + 'deg)';
  if (ip > .992 && ipT >= 1) finishIntro();
}

/* ---------- loop: turn toward where you're looking, and lean a little with the pointer so near things move more than far ones ---------- */
var hint = document.getElementById('hint'), hintGone = false;
function frame(t){
  if (intro) { introFrame(t); requestAnimationFrame(frame); return; }
  var calm = detailOpen || REDUCE, sway = calm ? 0 : Math.sin(t / 3200) * 16;
  var hx = calm ? 0 : head.x, hy = calm ? 0 : head.y;
  yaw += (yawT + (FINE ? hx * 6 : 0) - yaw) * .17; pitch += (pitchT - (FINE ? hy * 4 : 0) - pitch) * .17; push += (pushT - push) * .2;
  cam.x += ((FINE ? hx * 150 : 0) + sway - cam.x) * .08; cam.y += ((FINE ? hy * 70 : 0) - cam.y) * .08;
  world.style.transform = 'translateZ(' + (P - push * 260).toFixed(2) + 'px) translate3d(' + (-cam.x).toFixed(2) + 'px,' + (-cam.y).toFixed(2) + 'px,0) rotateX(' + (-pitch).toFixed(3) + 'deg) rotateY(' + yaw.toFixed(3) + 'deg)';
  syncOrn();
  if (!hintGone && Math.abs(yawT) > 15) { hintGone = true; hint.style.opacity = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
