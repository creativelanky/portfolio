<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triumph Ohwojeheri — Product Designer</title>
<meta name="description" content="Independent product designer turning complex ideas into thoughtful digital experiences. Selected work across Web3, fintech, and AI.">
<meta property="og:title" content="Triumph Ohwojeheri — Product Designer"><meta property="og:description" content="Complex ideas. Thoughtfully simple experiences."><meta property="og:image" content="https://thetriumph.xyz/social-thumbnail.png"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../Favicon.avif">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="space.css">
<script src="cases.js"></script>
</head>
<body class="room">
<canvas id="env"></canvas>
<div class="stage" id="stage"><div class="world" id="world"></div></div>

<div class="hint" id="hint">Drag to look around · Click a window, or pinch on your trackpad, to pull it closer</div>
<a class="brand" href="#" data-go="0" aria-label="Triumph Ohwojeheri, home"><span class="mono">t.</span><span>Triumph<br>Ohwojeheri</span></a>
<nav class="orn" id="orn" aria-label="Rooms">
  <button data-go="-112">Contact</button>
  <button data-go="-58">About</button>
  <button data-go="0" class="on">Home</button>
  <button data-go="60">Work</button>
  <button data-go="138">Playground</button>
</nav>

<div class="detail" id="detail" role="dialog" aria-modal="true"><div class="dwin" id="dwin"></div></div>
<div class="gaze" id="gaze"></div>

<script>
(function(){
"use strict";
function src(f){ return '../' + encodeURI(f); }
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* ---------- what hangs where. ang: degrees around you (negative = left); y: height; z: nearer (+) or further (-) ---------- */
var PANELS = [
  { ang: 0, y: -10, w: 640, h: 420, d: .1, kind: 'hero',
    html: '<div class="in"><div class="row-top"><span class="kicker">Independent product designer · Lagos</span><span class="avail"><i></i>Available for select projects</span></div>' +
          '<div class="h1">Complex ideas.<br><span class="soft">Thoughtfully</span> simple<span class="acc">.</span></div>' +
          '<div class="p">I’m Triumph. I turn complex problems into digital experiences that feel right. From Web3 to the everyday.</div>' +
          '<div class="row"><span class="btn pri" data-go="60">Explore selected work →</span><span class="btn" data-go="-112">Let’s talk</span></div></div>' }
];

/* the work wall: three columns, two rows, a little depth between them */
var COLS = [36, 60, 84], ROWS = [-212, 212], DEPTH = [20, -30, 10, -10, 30, -20];
CASES.forEach(function(c, i){
  PANELS.push({ ang: COLS[i % 3], y: ROWS[Math.floor(i / 3)], z: DEPTH[i], w: 300, h: 400, d: .2 + i * .05, kind: 'case', ci: i,
    html: '<div class="in"><div class="cover"><img src="' + src(c.cover) + '" alt="' + esc(c.name) + '" draggable="false"></div>' +
          '<div class="cap"><span class="num">' + String(i + 1).padStart(2, '0') + '</span><span class="cat">' + c.category + '</span></div>' +
          '<div class="h2">' + c.name + '</div><div class="p sm">' + c.tagline + '</div></div>' });
});

/* the playground: shots outside the case studies */
SHOTS.slice(0, 6).forEach(function(s, i){
  PANELS.push({ ang: [116, 138, 160][i % 3], y: i < 3 ? -125 : 125, z: i % 2 ? -20 : 10, w: 300, h: 215, d: .5 + i * .04, kind: 'shot', shot: s,
    html: '<div class="shot"><img src="' + src(s) + '" alt="UI shot" loading="lazy" draggable="false"></div>' });
});

/* about */
PANELS.push(
  { ang: -42, y: -10, w: 300, h: 430, d: .3, z: -20, kind: 'about',
    html: '<div class="in"><div class="portrait"><img src="' + src('photo-3.jpg') + '" alt="Triumph Ohwojeheri" draggable="false"></div><div class="h2" style="margin-top:16px">Triumph Ohwojeheri</div><div class="p sm" style="margin-top:2px">Product designer · Lagos, NG</div></div>' },
  { ang: -70, y: -145, w: 430, h: 260, d: .35, kind: 'about',
    html: '<div class="in"><div class="kicker">A little about me</div><div class="h2 lg" style="margin-top:12px">Curious by nature.<br>Intentional by design.</div>' +
          '<div class="p sm">I work at the intersection of clarity, utility, and a little unexpected delight.</div></div>' },
  { ang: -70, y: 150, w: 430, h: 300, d: .4, kind: 'about',
    html: '<div class="in"><div class="kicker">Track record</div><ul class="list">' +
          '<li><span>Designing products</span><span>4 years</span></li><li><span>Projects shipped</span><span>20+</span></li>' +
          '<li><span>Worked with</span><span>Silk, Bitazza, Kryptos, Dreamspace, Human Tech</span></li><li><span>Focus</span><span>Web3 · Fintech · AI</span></li></ul>' +
          '<div class="p sm" style="margin-top:auto">On the side, I vibe-code my designs to life, end to end.</div></div>' }
);

/* contact */
PANELS.push({ ang: -112, y: -10, w: 470, h: 380, d: .45, kind: 'contact',
  html: '<div class="in"><div class="kicker">Have something in mind?</div><div class="h1 md">Let’s make it<br><span class="soft">something good.</span></div>' +
        '<a class="mail" href="mailto:triumphohwojeheri@gmail.com">triumphohwojeheri@gmail.com ↗</a>' +
        '<div class="row"><a class="btn pri" href="mailto:triumphohwojeheri@gmail.com">Email me</a><a class="btn" href="https://calendly.com/triumphohwojeheri/30min" target="_blank" rel="noopener">Book a call ↗</a></div>' +
        '<div class="socials"><a href="https://twitter.com/amazinglanky" target="_blank" rel="noopener">X</a><a href="https://instagram.com/amazinglanky" target="_blank" rel="noopener">Instagram</a><a href="https://dribbble.com/amazinglanky" target="_blank" rel="noopener">Dribbble</a><a href="https://linkedin.com/in/triumph-ohwojeheri" target="_blank" rel="noopener">LinkedIn</a><span class="clock" id="clock"></span></div></div>' });

var LABELS = [{ t: 'Selected work (01—06)', ang: 60, y: -485 }, { t: 'Outside the case studies', ang: 138, y: -300 }, { t: 'A little about me', ang: -56, y: -320 }, { t: 'Let’s talk', ang: -112, y: -240 }];

/* ---------- build ---------- */
var stage = document.getElementById('stage'), world = document.getElementById('world');
var R = 1000, P = 900, YMIN = -130, YMAX = 165;
var els = PANELS.map(function(p, i){
  var e = document.createElement('div'); e.className = 'panel k-' + p.kind;
  e.style.width = p.w + 'px'; e.style.height = p.h + 'px'; e.style.left = -p.w / 2 + 'px'; e.style.top = -p.h / 2 + 'px';
  e.style.transform = 'rotateY(' + (-p.ang) + 'deg) translate3d(0,' + p.y + 'px,' + (-(R - (p.z || 0))) + 'px)';
  e.innerHTML = '<div class="glass" style="--d:' + p.d.toFixed(2) + 's">' + p.html + '</div><div class="grab"></div>';
  e._i = i; world.appendChild(e); return e;
});
LABELS.forEach(function(l){
  var e = document.createElement('div'); e.className = 'section-label'; e.textContent = l.t;
  e.style.transform = 'rotateY(' + (-l.ang) + 'deg) translate3d(-50%,' + l.y + 'px,' + (-R) + 'px)';
  world.appendChild(e);
});

/* ---------- head: where you're looking ---------- */
var yaw = -24, pitch = 0, yawT = 0, pitchT = 0, head = { x: 0, y: 0 }, push = 0, pushT = 0;
var FINE = matchMedia('(pointer:fine)').matches;
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function fit(){
  /* a narrower or shorter screen gets a wider field of view, so the walls still fit */
  /* phones: zoom in so the windows stay readable; you turn more to see the walls */
  P = innerWidth < 700 ? Math.min(innerWidth * 1.4, innerHeight * .75) : Math.max(360, Math.min(900, innerWidth * .62, innerHeight * .9));
  stage.style.perspective = P + 'px';
}
fit(); addEventListener('resize', function(){ fit(); sizeEnv(); });

/* return to a wall: case pages link back with #work, #about… */
var ROOMS = { contact: -112, about: -58, home: 0, work: 60, playground: 138 };
if (ROOMS[location.hash.slice(1)] != null) { yawT = ROOMS[location.hash.slice(1)]; yaw = yawT - 20; }
addEventListener('hashchange', function(){ var a = ROOMS[location.hash.slice(1)]; if (a != null) turnTo(a); });

var drag = null, moved = 0;
addEventListener('pointerdown', function(e){
  if (detailOpen) return;
  drag = { x: e.clientX, y: e.clientY, yaw: yawT, pitch: pitchT }; moved = 0; gaze.classList.add('pinch');
});
addEventListener('pointermove', function(e){
  gaze.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  if (FINE) { head.x = (e.clientX / innerWidth - .5) * 12; head.y = (e.clientY / innerHeight - .5) * -7; }
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  yawT = clamp(drag.yaw - dx * .15, YMIN, YMAX); pitchT = clamp(drag.pitch + dy * .08, -14, 14);
});
addEventListener('pointerup', function(){ drag = null; gaze.classList.remove('pinch'); });

/* a trackpad pinch arrives as ctrl+wheel: pinch in on a window to pull it closer, pinch out to let it go */
addEventListener('wheel', function(e){
  if (detailOpen && !e.ctrlKey) return;
  e.preventDefault();
  if (e.ctrlKey) {
    if (e.deltaY < -2 && !detailOpen && hovered) open(hovered);
    else if (e.deltaY > 2 && detailOpen) close();
    return;
  }
  yawT = clamp(yawT + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * .07, YMIN, YMAX);
}, { passive: false });
addEventListener('keydown', function(e){
  if (e.key === 'Escape' && detailOpen) close();
  if (detailOpen) return;
  if (e.key === 'ArrowRight') yawT = clamp(yawT + 24, YMIN, YMAX);
  if (e.key === 'ArrowLeft') yawT = clamp(yawT - 24, YMIN, YMAX);
});

/* ---------- windows: gaze highlight, tilt, pinch ---------- */
var gaze = document.getElementById('gaze'), hovered = null;
els.forEach(function(el){
  var g = el.querySelector('.glass');
  el.addEventListener('pointerenter', function(){ hovered = el; el.classList.add('hover'); gaze.classList.add('big'); });
  el.addEventListener('pointerleave', function(){ if (hovered === el) hovered = null; el.classList.remove('hover'); gaze.classList.remove('big');
    g.style.setProperty('--rx', '0deg'); g.style.setProperty('--ry', '0deg'); });
  el.addEventListener('pointermove', function(e){
    var r = el.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    g.style.setProperty('--mx', u * 100 + '%'); g.style.setProperty('--my', v * 100 + '%');
    g.style.setProperty('--ry', (u - .5) * 7 + 'deg'); g.style.setProperty('--rx', (.5 - v) * 7 + 'deg');
  });
  el.addEventListener('click', function(e){
    if (moved > 6) { e.preventDefault(); return; }
    if (e.target.closest('a[href]')) return;
    var go = e.target.closest('[data-go]');
    if (go) { turnTo(+go.getAttribute('data-go')); return; }
    open(el);
  });
});

var orn = document.getElementById('orn');
[orn, document.querySelector('.brand')].forEach(function(n){ n.addEventListener('pointerdown', function(e){ e.stopPropagation(); }); });
orn.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) turnTo(+b.getAttribute('data-go')); });
document.querySelector('.brand').addEventListener('click', function(e){ e.preventDefault(); turnTo(0); });
function turnTo(a){ yawT = a; pitchT = 0; }
function syncOrn(){
  var best = null, bd = 1e9;
  [].forEach.call(orn.children, function(b){ var d = Math.abs(+b.getAttribute('data-go') - yaw); if (d < bd) { bd = d; best = b; } });
  [].forEach.call(orn.children, function(b){ b.classList.toggle('on', b === best); });
}

/* ---------- a pinched window flies from the wall to right in front of you ---------- */
var detail = document.getElementById('detail'), dwin = document.getElementById('dwin'), detailOpen = null;
function caseView(i){
  var c = CASES[i], nx = (i + 1) % CASES.length;
  return '<div class="dcase"><div class="dimg"><img src="' + src(c.cover) + '" alt="' + esc(c.name) + '"></div>' +
    '<div class="dtext"><div class="cap"><span class="num">' + String(i + 1).padStart(2, '0') + ' / ' + String(CASES.length).padStart(2, '0') + '</span><span class="cat">' + c.category + ' · ' + c.year + '</span></div>' +
    '<div class="h1 md">' + c.name + '</div><div class="p">' + c.statement + '</div>' +
    '<dl class="meta">' + c.meta.slice(0, 4).map(function(m){ return '<div><dt>' + m[0] + '</dt><dd>' + m[1] + '</dd></div>'; }).join('') + '</dl>' +
    '<div class="row"><a class="btn pri" href="case.html?p=' + c.slug + '">Read the case study →</a><button class="btn" data-next="' + nx + '">Next: ' + CASES[nx].name + '</button></div></div></div>';
}
function open(el){
  var p = PANELS[el._i], html;
  if (p.kind === 'case') html = caseView(p.ci);
  else if (p.kind === 'shot') html = '<div class="dshot"><img src="' + src(p.shot) + '" alt="UI shot"></div>';
  else return;
  detailOpen = el;
  dwin.className = 'dwin ' + (p.kind === 'shot' ? 'is-shot' : '');
  dwin.innerHTML = '<button class="close" id="dclose" aria-label="Close">✕</button>' + html;
  detail.style.pointerEvents = ''; detail.classList.add('open'); document.body.classList.add('focus-mode'); pushT = 1;
  var a = el.querySelector('.glass').getBoundingClientRect(), b = dwin.getBoundingClientRect();
  el.style.visibility = 'hidden';
  dwin.animate([
    { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')', borderRadius: '60px', opacity: .5 },
    { transform: 'none', borderRadius: '32px', opacity: 1 }
  ], { duration: 360, easing: 'cubic-bezier(.2,.9,.1,1)' });
}
function close(){
  if (!detailOpen) return;
  var el = detailOpen; detailOpen = null; pushT = 0;
  document.body.classList.remove('focus-mode');
  detail.style.pointerEvents = 'none';
  var a = el.querySelector('.glass').getBoundingClientRect(), b = dwin.getBoundingClientRect();
  dwin.animate([
    { transform: 'none', opacity: 1 },
    { transform: 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px) scale(' + a.width / b.width + ',' + a.height / b.height + ')', opacity: .4 }
  ], { duration: 260, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = function(){ detail.classList.remove('open'); el.style.visibility = ''; };
}
detail.addEventListener('click', function(e){
  if (e.target === detail || e.target.closest('#dclose')) { close(); return; }
  var nx = e.target.closest('[data-next]');
  if (nx) {
    /* swap the window's contents in place, and turn the room so the next project is behind it */
    var i = +nx.getAttribute('data-next'), target = els.filter(function(x){ return PANELS[x._i].ci === i; })[0];
    detailOpen.style.visibility = ''; detailOpen = target; target.style.visibility = 'hidden';
    yawT = PANELS[target._i].ang;
    dwin.querySelector('.dcase').outerHTML = caseView(i);
    dwin.animate([{ opacity: .3, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.9,.1,1)' });
  }
});

/* ---------- the room: horizon, floor grid, dust; it turns exactly with your head ---------- */
var cv = document.getElementById('env'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = Math.min(2, devicePixelRatio || 1), DUST = [];
function sizeEnv(){
  W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  DUST = []; for (var i = 0; i < 200; i++) DUST.push({ a: Math.random() * 360, e: Math.random() * 50 - 5, s: Math.random() * 1.3 + .3, o: Math.random() * .5 + .1 });
}
sizeEnv();
function drawEnv(t){
  var ppd = P * Math.PI / 180, hz = H * .62 + pitch * ppd;
  var sky = cx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#000'); sky.addColorStop(clamp(hz / H - .25, 0, 1), '#030304'); sky.addColorStop(clamp(hz / H, 0, 1), '#0b0a0a'); sky.addColorStop(1, '#020202');
  cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
  /* the room's light: faint and warm, fixed in the world */
  [[0, '230,161,125', .05], [60, '220,215,210', .035], [-80, '220,215,210', .03], [138, '230,161,125', .03]].forEach(function(L){
    var x = W / 2 + (L[0] - yaw) * ppd, g = cx.createRadialGradient(x, hz, 0, x, hz, W * .55);
    g.addColorStop(0, 'rgba(' + L[1] + ',' + L[2] + ')'); g.addColorStop(1, 'rgba(' + L[1] + ',0)');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  });
  cx.save(); cx.beginPath(); cx.rect(0, hz, W, H - hz); cx.clip();
  cx.strokeStyle = 'rgba(255,255,255,.035)'; cx.lineWidth = 1;
  for (var k = 1; k < 30; k++) { var y = hz + 380 / (31 - k) + Math.pow(k / 30, 3) * (H - hz); if (y > H) break; cx.globalAlpha = Math.min(1, (y - hz) / 140); cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
  cx.globalAlpha = 1;
  for (var a = -180; a <= 180; a += 10) {
    var rel = ((a - yaw + 180) % 360 + 360) % 360 - 180; if (Math.abs(rel) > 80) continue;
    var bx = W / 2 + Math.tan(rel * Math.PI / 180) * P * 2.2, g2 = cx.createLinearGradient(0, hz, 0, H);
    g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(1, 'rgba(255,255,255,.05)');
    cx.strokeStyle = g2; cx.beginPath(); cx.moveTo(W / 2 + rel * ppd * .02, hz); cx.lineTo(bx, H + 40); cx.stroke();
  }
  cx.restore();
  DUST.forEach(function(d){
    var rel = ((d.a - yaw + 180) % 360 + 360) % 360 - 180; if (Math.abs(rel) > 70) return;
    cx.globalAlpha = d.o * .45 * (.6 + .4 * Math.sin(t * .001 + d.a * 3)); cx.fillStyle = '#ece6df';
    cx.beginPath(); cx.arc(W / 2 + rel * ppd, hz - d.e * ppd + Math.sin(t * .0004 + d.a) * 6, d.s, 0, 6.283); cx.fill();
  });
  cx.globalAlpha = 1;
}

/* ---------- Lagos time ---------- */
var clock = document.getElementById('clock');
function tick(){ if (clock) clock.textContent = 'Lagos ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Lagos', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()) + ' WAT'; }
tick(); setInterval(tick, 30000);

/* ---------- loop ---------- */
var hint = document.getElementById('hint'), hintGone = false;
function frame(t){
  var hx = detailOpen ? 0 : head.x, hy = detailOpen ? 0 : head.y;
  yaw += (yawT + hx - yaw) * .17; pitch += (pitchT + hy - pitch) * .17; push += (pushT - push) * .2;
  world.style.transform = 'translateZ(' + (P - push * 260).toFixed(2) + 'px) rotateX(' + (-pitch).toFixed(3) + 'deg) rotateY(' + yaw.toFixed(3) + 'deg)';
  drawEnv(t); syncOrn();
  if (!hintGone && Math.abs(yawT) > 15) { hintGone = true; hint.style.opacity = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
